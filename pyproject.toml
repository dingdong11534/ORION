[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-assistant"
version = "0.1.0"
description = "A local-first personal desktop AI assistant"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "striprtf>=0.0.26,<1",
    "odfpy>=1.4,<2",
    "pywhispercpp>=1.5.1,<2",
    "piper-tts>=1.8.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
orion = "orion.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orion*"]

[tool.setuptools.package-data]
"orion.ui" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
